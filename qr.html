<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xplore Missions - Scan to Start</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F5F3FF;
      color: #1E1B4B;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #E5E7EB;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }
    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .instruction {
      font-size: 18px;
      font-weight: 800;
      margin-top: 20px;
      color: #1E1B4B;
    }
    .url {
      font-size: 12px;
      font-weight: 600;
      color: #6D28D9;
      margin-top: 8px;
      word-break: break-all;
      text-decoration: none;
      display: inline-block;
    }
    .btn-print {
      margin-top: 30px;
      background-color: #1E1B4B;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-print:hover {
      background-color: #4338CA;
    }
    @media print {
      body {
        background-color: white;
      }
      .card {
        box-shadow: none;
        border: none;
        padding: 0;
        margin: 0;
      }
      .btn-print {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">XPLORE</div>
    <div class="qr-container" id="qrcode"></div>
    <div class="instruction">Scan to start your Xplore Mission</div>
    <a class="url" id="target-url" href="https://xplore-missions.vercel.app">https://xplore-missions.vercel.app</a>
    <br />
    <button class="btn-print" onclick="window.print()">Print Handout</button>
  </div>

  <script>
    const vercelUrl = window.location.origin;
    const fallbackUrl = "https://xplore-missions.vercel.app";
    const targetUrl = vercelUrl.includes("localhost") || vercelUrl.includes("127.0.5") || vercelUrl.includes("127.0.0.1") ? fallbackUrl : vercelUrl;
    
    document.getElementById("target-url").innerText = targetUrl;
    document.getElementById("target-url").href = targetUrl;

    new QRCode(document.getElementById("qrcode"), {
      text: targetUrl,
      width: 256,
      height: 256,
      colorDark : "#1E1B4B",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
